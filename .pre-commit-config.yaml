# Pre-commit configuration for ZSH Terminal Installation Script
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

repos:
  # General hooks for file formatting and validation
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      # Prevent committing large files
      - id: check-added-large-files
        args: ['--maxkb=1000']
      
      # Check for files that would conflict in case-insensitive filesystems
      - id: check-case-conflict
      
      # Ensure that a file is either empty or ends with one newline
      - id: end-of-file-fixer
        exclude: '\.bats$'
      
      # Replaces or checks mixed line endings
      - id: mixed-line-ending
        args: ['--fix=lf']
      
      # Remove trailing whitespace
      - id: trailing-whitespace
        exclude: '\.md$'
      
      # Check for files that contain merge conflict strings
      - id: check-merge-conflict
      
      # Check for debugger imports and py37+ breakpoint() calls
      - id: debug-statements
      
      # Check whether the files parse as valid python
      - id: check-ast
        types: [python]
      
      # Check for valid JSON
      - id: check-json
      
      # Check for valid YAML
      - id: check-yaml
        args: ['--allow-multiple-documents']
      
      # Check for valid TOML
      - id: check-toml
      
      # Check for valid XML
      - id: check-xml
      
      # Prevent addition of new git submodules
      - id: forbid-new-submodules
      
      # Check that executables have shebangs
      - id: check-executables-have-shebangs
      
      # Check that shell scripts have proper shebangs
      - id: check-shebang-scripts-are-executable

  # ShellCheck for shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.6
    hooks:
      - id: shellcheck
        args: ['-e', 'SC1091,SC2034,SC2154']
        files: '\.(sh|bash|zsh)$'
        exclude: 'tests/.*\.bats$'

  # Bash syntax checking
  - repo: local
    hooks:
      - id: bash-syntax
        name: Check Bash syntax
        entry: bash -n
        language: system
        files: '\.(sh|bash)$'
        exclude: 'tests/.*\.bats$'

  # BATS test validation
  - repo: local
    hooks:
      - id: bats-syntax
        name: Check BATS syntax
        entry: bash -c 'for file in "$@"; do if command -v bats >/dev/null 2>&1; then bats --syntax-only "$file"; else echo "BATS not installed, skipping syntax check for $file"; fi; done'
        language: system
        files: '\.bats$'
        pass_filenames: true

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.37.0
    hooks:
      - id: markdownlint
        args: ['--fix']
        exclude: 'CHANGELOG.md'

  # Security scanning for secrets
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: 'tests/.*'

  # File permissions check
  - repo: local
    hooks:
      - id: check-file-permissions
        name: Check file permissions
        entry: bash -c 'for file in "$@"; do if [[ "$file" == *.sh ]] && [[ ! -x "$file" ]]; then echo "$file should be executable"; exit 1; fi; done'
        language: system
        files: '\.sh$'
        pass_filenames: true

  # Configuration file validation
  - repo: local
    hooks:
      - id: validate-config
        name: Validate configuration files
        entry: bash -c 'for file in "$@"; do if [[ "$file" == *.conf ]]; then bash -n "$file" || exit 1; fi; done'
        language: system
        files: '\.conf$'
        pass_filenames: true

  # Documentation consistency check
  - repo: local
    hooks:
      - id: check-readme-links
        name: Check README links
        entry: bash -c 'if command -v markdown-link-check >/dev/null 2>&1; then markdown-link-check README.md; else echo "markdown-link-check not installed, skipping link validation"; fi'
        language: system
        files: 'README\.md$'
        pass_filenames: false

# Global configuration
default_language_version:
  python: python3

# Exclude patterns
exclude: |
  (?x)^(
    \.git/.*|
    \.github/.*|
    node_modules/.*|
    \.vscode/.*|
    \.idea/.*|
    .*\.log|
    .*\.tmp|
    .*\.bak
  )$

# Fail fast - stop running hooks after the first failure
fail_fast: false

# Default stages to run hooks on
default_stages: [commit, push]

# Minimum pre-commit version
minimum_pre_commit_version: '2.20.0'