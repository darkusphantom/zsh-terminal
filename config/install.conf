#!/bin/bash
# Configuration file for ZSH Terminal Installation
# All URLs, paths, and settings are centralized here

# Installation URLs and repositories
OH_MY_ZSH_URL="https://raw.github.com/ohmyzsh/ohmyzsh/master/tools/install.sh"
OH_MY_ZSH_CHECKSUM="" # Add checksum for security validation
POWERLEVEL10K_REPO="https://github.com/romkatv/powerlevel10k.git"
FONT_URL="https://github.com/romkatv/powerlevel10k-media/raw/master/MesloLGS%20NF%20Regular.ttf"
FONT_CHECKSUM="" # Add checksum for security validation

# Plugin repositories
ZSH_SYNTAX_HIGHLIGHTING_REPO="https://github.com/zsh-users/zsh-syntax-highlighting.git"
ZSH_AUTOSUGGESTIONS_REPO="https://github.com/zsh-users/zsh-autosuggestions"
ALIAS_TIPS_REPO="https://github.com/djui/alias-tips.git"
CUSTOM_TERMINAL_REPO="https://github.com/darkusphantom/My-Custom-Terminal.git"

# Directory configuration
LOG_DIR="${HOME}/.local/log/zsh-install"
TEMP_DIR="/tmp/zsh-install-$$"
BACKUP_DIR="${HOME}/.local/backup/zsh-install"
ZSH_CUSTOM="${ZSH_CUSTOM:-$HOME/.oh-my-zsh/custom}"
FONT_DIR="/usr/share/fonts/MesloLGS"
CONFIG_ZSH_DIR="${HOME}/.config/zsh"

# Package names by OS
UBUNTU_PACKAGES=("zsh" "wget" "git" "fonts-powerline")
CENTOS_PACKAGES=("zsh" "wget" "git" "powerline-fonts")
MACOS_PACKAGES=("zsh" "wget" "git")

# Installation options
DEFAULT_SHELL_CHANGE=true
CREATE_BACKUP=true
VERBOSE_LOGGING=true
STRICT_MODE=true

# Timeout settings (in seconds)
DOWNLOAD_TIMEOUT=30
GIT_CLONE_TIMEOUT=60
COMMAND_TIMEOUT=120

# Colors for output
COLOR_RED='\033[0;31m'
COLOR_GREEN='\033[0;32m'
COLOR_YELLOW='\033[1;33m'
COLOR_BLUE='\033[0;34m'
COLOR_NC='\033[0m' # No Color

# Version information
SCRIPT_VERSION="2.0.0"
MIN_BASH_VERSION="4.0"
MIN_ZSH_VERSION="5.0"